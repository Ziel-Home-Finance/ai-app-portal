name: Supabase Keepalive

on:
  schedule:
    # 每 4 天 UTC 01:00（北京时间 09:00）执行一次
    - cron: '0 1 */4 * *'
  workflow_dispatch: # 允许手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: https://vmxgzyctprcdqprjhulk.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/bond_ledgers?select=id&limit=1")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase is active and responding normally"
          else
            echo "⚠️ Supabase returned status $STATUS - project may be paused"
            exit 1
          fi

      - name: Keep repo active (prevent 60-day auto-disable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create or update a keepalive marker file to generate repo activity
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive-marker.txt
          git add .github/keepalive-marker.txt
          # Only commit if there are changes (avoids empty commit errors)
          git diff --quiet && git diff --cached --quiet || git commit -m "chore: keepalive ping $(date -u '+%Y-%m-%d')"
          git push
